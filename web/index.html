<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISR Spectrum Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <span class="brand">ISR spectrum</span>
  <nav class="menus">
    <div class="menu"><button class="menu-btn" aria-expanded="false">Plasma</button><div class="panel" id="m-plasma"></div></div>
    <div class="menu"><button class="menu-btn" aria-expanded="false">Ions</button><div class="panel" id="m-ions"></div></div>
    <div class="menu"><button class="menu-btn" aria-expanded="false">Radar</button><div class="panel" id="m-radar"></div></div>
    <div class="menu"><button class="menu-btn" aria-expanded="false">View</button><div class="panel" id="m-view"></div></div>
    <div class="menu"><button class="menu-btn" aria-expanded="false">Numbers</button><div class="panel wide" id="m-numbers"></div></div>
    <div class="menu right"><button class="menu-btn" aria-expanded="false">About</button><div class="panel wide" id="m-about"></div></div>
  </nav>
</header>

<div id="summary" class="summary" aria-live="polite"></div>

<main>
  <div class="figure" id="figure">
    <canvas class="lines"></canvas>
    <canvas class="field" hidden></canvas>
    <canvas class="axes"></canvas>
  </div>
  <div id="warnings" class="warnings"></div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
