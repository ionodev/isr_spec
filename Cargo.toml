[package]
name = "isr_spec_web"
version = "0.1.0"
edition = "2021"
description = "Interactive incoherent scatter radar spectrum (Rust/WebAssembly port of jvierine/isr_spec)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = "6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
