# Builds the Rust/WebAssembly spectrum explorer and publishes web/ to
# GitHub Pages (https://ionodev.github.io/isr_spec/).
name: Publish the spectrum explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain and wasm-pack
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: Unit tests
        run: cargo test --release
      - name: Build the WebAssembly package
        run: wasm-pack build --release --target web --out-dir web/pkg --no-typescript
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
